<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>专属照片消消乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            color: #fff;
            overflow-x: hidden;
        }
        .info-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            padding: 12px 10px;
            font-size: 16px;
            margin-bottom:12px;
            background:#242442;
            border-radius:12px;
        }
        #gameBoard {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap:5px;
            max-width:480px;
            width:100%;
        }
        .cell {
            aspect-ratio:1/1;
            border-radius:10px;
            overflow:hidden;
            cursor:grab;
            transition: transform 0.15s ease;
        }
        .cell:active{
            transform: scale(0.93);
        }
        .cell img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 三种图片独立边框，颜色区分明显 */
        .type0{border:4px solid #42a5f5;}
        .type1{border:4px solid #ff9800;}
        .type2{border:4px solid #2ecc71;}

        .mask {
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.75);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:99;
        }
        .popup{
            background:#242442;
            padding:32px 24px;
            border-radius:16px;
            text-align:center;
            margin:0 20px;
        }
        .popup h2{margin-bottom:16px; font-size:22px;}
        .popup button{
            padding:10px 24px;
            border:none;
            border-radius:8px;
            background:#42a5f5;
            color:#fff;
            font-size:16px;
            cursor:pointer;
            margin-top:12px;
        }
    </style>
</head>
<body>
    <div class="info-bar">
        <div>分数：<span id="score">0</span></div>
        <div>步数：<span id="step">35</span></div>
        <div>目标：1200</div>
    </div>
    <div id="gameBoard"></div>

    <div class="mask" id="popMask">
        <div class="popup">
            <h2 id="popTitle">游戏结束</h2>
            <p id="popText"></p>
            <button onclick="restartGame()">重新开始</button>
        </div>
    </div>

<script>
// ========== 配置项（无需修改！github上传后自动匹配路径）==========
const COL = 6;
const ROW = 7;
const TARGET_SCORE = 1200;
const MAX_STEP = 35;
// Github相对路径，图片和html放在同一个文件夹，直接使用
const IMG_LIST = [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg"
];

let board = [];
let score = 0;
let stepLeft = MAX_STEP;
let dragCell = null;
let gameLock = false;

const boardDom = document.getElementById("gameBoard");
const scoreDom = document.getElementById("score");
const stepDom = document.getElementById("step");
const popMask = document.getElementById("popMask");
const popTitle = document.getElementById("popTitle");
const popText = document.getElementById("popText");

// 初始化游戏
function initGame(){
    score = 0;
    stepLeft = MAX_STEP;
    updateUI();
    boardDom.innerHTML = "";
    board = [];
    for(let y=0;y<ROW;y++){
        board[y] = [];
        for(let x=0;x<COL;x++){
            let t;
            do{
                t = getRandomType();
            }while(checkInitMatch(x,y,t));
            board[y][x] = t;
        }
    }
    renderBoard();
    popMask.style.display = "none";
}

function getRandomType(){
    return Math.floor(Math.random()*3);
}

function checkInitMatch(x,y,type){
    if(x>=2){
        if(board[y][x-1]===type && board[y][x-2]===type) return true;
    }
    if(y>=2){
        if(board[y-1][x]===type && board[y-2][x]===type) return true;
    }
    return false;
}

function renderBoard(){
    boardDom.innerHTML = "";
    for(let y=0;y<ROW;y++){
        for(let x=0;x<COL;x++){
            const type = board[y][x];
            const div = document.createElement("div");
            div.className = `cell type${type}`;
            div.dataset.x = x;
            div.dataset.y = y;
            div.innerHTML = `<img src="${IMG_LIST[type]}" alt="">`;
            bindDragEvent(div);
            boardDom.appendChild(div);
        }
    }
}

// 微信触摸优化拖拽
function bindDragEvent(dom){
    let startX,startY;
    const x = Number(dom.dataset.x);
    const y = Number(dom.dataset.y);

    dom.addEventListener("mousedown",startDrag);
    dom.addEventListener("touchstart",startDrag,{passive:true});

    function startDrag(e){
        if(gameLock) return;
        dragCell = {x,y};
        if(e.type==="touchstart"){
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            document.addEventListener("touchmove",move);
            document.addEventListener("touchend",endDrag);
        }else{
            startX = e.clientX;
            startY = e.clientY;
            document.addEventListener("mousemove",move);
            document.addEventListener("mouseup",endDrag);
        }
    }
    function move(e){
        // 禁止页面滚动
        if(e.type === 'touchmove') e.preventDefault();
    }
    function endDrag(e){
        document.removeEventListener("mousemove",move);
        document.removeEventListener("mouseup",endDrag);
        document.removeEventListener("touchmove",move);
        document.removeEventListener("touchend",endDrag);
        if(!dragCell) return;
        let endX,endY;
        if(e.type==="touchend"){
            endX = e.changedTouches[0].clientX;
            endY = e.changedTouches[0].clientY;
        }else{
            endX = e.clientX;
            endY = e.clientY;
        }
        const dx = endX - startX;
        const dy = endY - startY;
        let targetX = x;
        let targetY = y;
        if(Math.abs(dx) > Math.abs(dy)){
            if(dx>35) targetX +=1;
            else if(dx<-35) targetX -=1;
        }else{
            if(dy>35) targetY +=1;
            else if(dy<-35) targetY -=1;
        }
        if((targetX !==x || targetY!==y)
            && targetX>=0 && targetX<COL
            && targetY>=0 && targetY<ROW){
            trySwap(x,y,targetX,targetY);
        }
        dragCell = null;
    }
}

async function trySwap(x1,y1,x2,y2){
    gameLock = true;
    [board[y1][x1], board[y2][x2]] = [board[y2][x2], board[y1][x1]];
    renderBoard();
    const matchList = findAllMatch();
    if(matchList.length>0){
        stepLeft--;
        updateUI();
        await startEliminate();
        checkGameOver();
    }else{
        await sleep(150);
        [board[y1][x1], board[y2][x2]] = [board[y2][x2], board[y1][x1]];
        renderBoard();
    }
    gameLock = false;
}

function findAllMatch(){
    const matched = new Set();
    for(let y=0;y<ROW;y++){
        for(let x=0;x<COL-2;x++){
            const t = board[y][x];
            if(t === null) continue;
            if(board[y][x+1]===t && board[y][x+2]===t){
                matched.add(`${x},${y}`);
                matched.add(`${x+1},${y}`);
                matched.add(`${x+2},${y}`);
                let nx = x+3;
                while(nx<COL && board[y][nx]===t){
                    matched.add(`${nx},${y}`);
                    nx++;
                }
            }
        }
    }
    for(let x=0;x<COL;x++){
        for(let y=0;y<ROW-2;y++){
            const t = board[y][x];
            if(t === null) continue;
            if(board[y+1][x]===t && board[y+2][x]===t){
                matched.add(`${x},${y}`);
                matched.add(`${x},${y+1}`);
                matched.add(`${x},${y+2}`);
                let ny = y+3;
                while(ny<ROW && board[ny][x]===t){
                    matched.add(`${x},${ny}`);
                    ny++;
                }
            }
        }
    }
    return Array.from(matched).map(str=>{
        const [px,py] = str.split(",").map(Number);
        return {x:px,y:py};
    });
}

async function startEliminate(){
    let matchArr;
    while((matchArr = findAllMatch()).length>0){
        score += matchArr.length * 10;
        updateUI();
        matchArr.forEach(({x,y})=>{
            board[y][x] = null;
        });
        renderBoard();
        await sleep(200);
        dropBlocks();
        fillNewBlocks();
        renderBoard();
        await sleep(250);
    }
}

function dropBlocks(){
    for(let x=0;x<COL;x++){
        for(let y=ROW-1;y>=0;y--){
            if(board[y][x] === null){
                for(let k=y-1;k>=0;k--){
                    if(board[k][x]!==null){
                        board[y][x] = board[k][x];
                        board[k][x] = null;
                        break;
                    }
                }
            }
        }
    }
}

function fillNewBlocks(){
    for(let x=0;x<COL;x++){
        for(let y=0;y<ROW;y++){
            if(board[y][x] === null){
                board[y][x] = getRandomType();
            }
        }
    }
}

function updateUI(){
    scoreDom.innerText = score;
    stepDom.innerText = stepLeft;
}

function checkGameOver(){
    if(score >= TARGET_SCORE){
        popTitle.innerText = "🎉 恭喜通关！";
        popText.innerText = `最终得分：${score}，剩余步数：${stepLeft}`;
        popMask.style.display = "flex";
        return;
    }
    if(stepLeft <= 0){
        popTitle.innerText = "💔 挑战失败";
        popText.innerText = `得分${score}，目标${TARGET_SCORE}，再接再厉！`;
        popMask.style.display = "flex";
    }
}

function restartGame(){
    initGame();
}

function sleep(ms){
    return new Promise(res=>setTimeout(res,ms));
}

window.onload = initGame;
</script>
</body>
</html>
